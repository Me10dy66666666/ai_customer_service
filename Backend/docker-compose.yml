services:
  vector-postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-customer-service-vector-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${VECTOR_POSTGRES_DB:-ai_customer_service_vectors}
      POSTGRES_USER: ${VECTOR_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${VECTOR_POSTGRES_PASSWORD:-postgres}
    volumes:
      - vector-postgres-data:/var/lib/postgresql/data
      - ../data-pipeline/sql/migrations/V1__knowledge_chunks.sql:/docker-entrypoint-initdb.d/V1__knowledge_chunks.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    container_name: ai-customer-service-libreoffice
    volumes:
      - ../uploads:/app/uploads
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: ai-customer-service-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: ai-customer-service-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.2.1
    container_name: ai-customer-service-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  vector-postgres-data:
  redis-data:
  rabbitmq-data:
  es-data:
