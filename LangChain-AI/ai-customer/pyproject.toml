[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-customer"
version = "0.1.0"
description = "LangChain and LangGraph starter project for AI workflows and agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "TRAE Assistant" }
]
dependencies = [
  "langchain>=1.3.14,<2.0.0",
  "langchain-core>=1.5.3,<2.0.0",
  "langchain-openai>=1.4.1,<2.0.0",
  "langchain-text-splitters>=1.1.2,<2.0.0",
  "langgraph>=1.2.10,<2.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "python-dotenv>=1.1.1,<2.0.0",
  "rich>=14.1.0,<15.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "tzdata>=2025.2",
  "typer>=0.16.0,<1.0.0",
  "fastapi>=0.141.1,<1.0.0",
  "pymysql>=1.1.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<10.0.0",
  "ruff>=0.12.5,<1.0.0"
]

[project.scripts]
ai-customer = "ai_customer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_customer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "skip_db: 跳过需要真实 MySQL 的测试",
  "run_e2e: 标记需要端到端模拟的测试",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
